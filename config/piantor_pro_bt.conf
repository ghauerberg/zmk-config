# Enable mouse emulation (required for MOUSE layer).
CONFIG_ZMK_POINTING=y

# Disable RGB underglow to save power.
CONFIG_ZMK_RGB_UNDERGLOW=n

# Enable USB HID boot protocol so the keyboard works in BIOS/UEFI pre-OS environments.
# Plug the LEFT half into the PC via USB-C before powering on; right half connects wirelessly.
CONFIG_USB_HID_BOOT_PROTOCOL=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"
